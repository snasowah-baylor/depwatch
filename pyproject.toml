[project]
name = "depwatch"
version = "0.1.0"
description = "Python dependency vulnerability scanner"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "httpx>=0.28",
  "packaging>=24",
  "cvss>=3.3",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.models", "app.routes", "app.services"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6",
  "respx>=0.22",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"
